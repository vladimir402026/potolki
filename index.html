<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор натяжных потолков</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f1f5f9; color: #1e293b; margin: 0; padding: 20px; }
        .box { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #2563eb; margin-top: 0; font-size: 22px; }
        h3 { font-size: 15px; border-bottom: 2px solid #f1f5f9; padding-bottom: 6px; color: #475569; margin-top: 20px; }
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 12px; }
        label { font-size: 14px; flex: 1; }
        input, select { width: 120px; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; text-align: right; }
        select { width: 185px; text-align: left; }
        .res { background: #eff6ff; border: 2px solid #bfdbfe; padding: 18px; border-radius: 10px; text-align: center; margin-top: 20px; }
        .sum { font-size: 32px; font-weight: bold; color: #2563eb; margin-top: 5px; }
        button { width: 100%; padding: 13px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .b-calc { background: #16a34a; color: #fff; }
        .b-copy { background: #2563eb; color: #fff; }
        .b-clr { background: #f8fafc; color: #64748b; border: 1px solid #cbd5e1; }
        details { background: #f8fafc; padding: 12px 15px; border-radius: 8px; border: 1px solid #cbd5e1; margin-bottom: 18px; }
        summary { font-weight: bold; font-size: 14px; cursor: pointer; text-align: center; color: #334155; }
    </style>
</head>
<body>
<div class="box">
    <h2>Калькулятор потолков</h2>

    <details>
        <summary>⚙️ Настроить мои цены (нажмите здесь)</summary>
        <h3>Прайс (работа + материал)</h3>
        <div class="row"><label>ПВХ Стандарт (м²):</label><input type="number" id="p_pvc" value="550" oninput="calc()"></div>
        <div class="row"><label>ПВХ Премиум (м²):</label><input type="number" id="p_prem" value="850" oninput="calc()"></div>
        <div class="row"><label>Ткань (м²):</label><input type="number" id="p_fab" value="2100" oninput="calc()"></div>
        <div class="row"><label>Профиль обычный (м.п.):</label><input type="number" id="p_pstd" value="150" oninput="calc()"></div>
        <div class="row"><label>Профиль теневой/парящий (м.п.):</label><input type="number" id="p_pshad" value="550" oninput="calc()"></div>
        <div class="row"><label>Вставка (м.п.):</label><input type="number" id="p_ins" value="100" oninput="calc()"></div>
        <div class="row"><label>Доп. угол > 4 (шт):</label><input type="number" id="p_cor" value="150" oninput="calc()"></div>
        <div class="row"><label>Точечный свет (шт):</label><input type="number" id="p_spot" value="450" oninput="calc()"></div>
        <div class="row"><label>Люстра (шт):</label><input type="number" id="p_chan" value="650" oninput="calc()"></div>
        <div class="row"><label>Световая линия/трек (м.п.):</label><input type="number" id="p_line" value="2200" oninput="calc()"></div>
        <div class="row"><label>Карниз/ниша (м.п.):</label><input type="number" id="p_curt" value="2600" oninput="calc()"></div>
        <div class="row"><label>Обвод трубы (шт):</label><input type="number" id="p_pipe" value="400" oninput="calc()"></div>
        <div class="row"><label>Керамогранит (м.п.):</label><input type="number" id="p_tile" value="450" oninput="calc()"></div>
        <div class="row"><label>Валюта:</label><input type="text" id="p_curr" value="грн" oninput="calc()"></div>
    </details>

    <h3>1. Полотно и профиль</h3>
    <div class="row"><label>Полотно:</label><select id="mat" onchange="calc()"><option value="pvc">ПВХ Стандарт</option><option value="prem">ПВХ Премиум</option><option value="fab">Ткань</option></select></div>
    <div class="row"><label>Площадь (м²):</label><input type="number" id="area" value="0" min="0" step="0.1" oninput="calc()"></div>
    <div class="row"><label>Периметр (м.п.):</label><input type="number" id="perim" value="0" min="0" step="0.1" oninput="calc()"></div>
    <div class="row"><label>Профиль:</label><select id="prof" onchange="calc()"><option value="pstd">Обычный</option><option value="pshad">Теневой / Парящий</option></select></div>
    <div class="row"><label>Вставка (м.п.):</label><input type="number" id="ins" value="0" min="0" step="0.1" oninput="calc()"></div>

    <h3>2. Свет и карнизы</h3>
    <div class="row"><label>Точечные светильники (шт):</label><input type="number" id="spot" value="0" min="0" oninput="calc()"></div>
    <div class="row"><label>Люстры (шт):</label><input type="number" id="chan" value="0" min="0" oninput="calc()"></div>
    <div class="row"><label>Световые линии / треки (м.п.):</label><input type="number" id="line" value="0" min="0" step="0.1" oninput="calc()"></div>
    <div class="row"><label>Карниз / ниша (м.п.):</label><input type="number" id="curt" value="0" min="0" step="0.1" oninput="calc()"></div>

    <h3>3. Сложности и допы</h3>
    <div class="row"><label>Всего углов (первые 4 беспл.):</label><input type="number" id="cor" value="4" min="0" oninput="calc()"></div>
    <div class="row"><label>Обвод труб (шт):</label><input type="number" id="pipe" value="0" min="0" oninput="calc()"></div>
    <div class="row"><label>Керамогранит (м.п.):</label><input type="number" id="tile" value="0" min="0" step="0.1" oninput="calc()"></div>
    <div class="row"><label>Доп. расходы / выезд:</label><input type="number" id="ext" value="0" min="0" oninput="calc()"></div>

    <button type="button" class="b-calc" onclick="calc()">🔄 Рассчитать стоимость</button>

    <div class="res">
        <div>Итоговая стоимость:</div>
        <div class="sum" id="tot">0 грн</div>
    </div>

    <button type="button" class="b-copy" onclick="copyText()">📋 Скопировать смету</button>
    <button type="button" class="b-clr" onclick="clr()">Очистить замер</button>
</div>

<script>
    function num(id) {
        var el = document.getElementById(id);
        if (!el) return 0;
        var v = String(el.value).replace(',', '.');
        return parseFloat(v) || 0;
    }

    function calc() {
        var m = document.getElementById('mat').value;
        var p = document.getElementById('prof').value;
        var c = num('cor');
        var extraCorners = c > 4 ? c - 4 : 0;
        var curr = document.getElementById('p_curr').value || 'грн';

        var sum =
            num('area') * num('p_' + m) +
            num('perim') * num('p_' + p) +
            num('ins') * num('p_ins') +
            num('spot') * num('p_spot') +
            num('chan') * num('p_chan') +
            num('line') * num('p_line') +
            num('curt') * num('p_curt') +
            extraCorners * num('p_cor') +
            num('pipe') * num('p_pipe') +
            num('tile') * num('p_tile') +
            num('ext');

        document.getElementById('tot').innerHTML = Math.round(sum) + ' ' + curr;
    }

    function copyText() {
        var curr = document.getElementById('p_curr').value || 'грн';
        var matSelect = document.getElementById('mat');
        var matName = matSelect.options[matSelect.selectedIndex].text;
        var profSelect = document.getElementById('prof');
        var profName = profSelect.options[profSelect.selectedIndex].text;

        var lines = [];
        lines.push(document.title + ':');
        if (num('area') > 0) lines.push('- ' + matName + ': ' + num('area') + ' m2');
        if (num('perim') > 0) lines.push('- ' + profName + ': ' + num('perim') + ' m.p.');
        if (num('ins') > 0) lines.push('- Vstavka: ' + num('ins') + ' m.p.');
        if (num('spot') > 0) lines.push('- Svetilniki: ' + num('spot') + ' sht');
        if (num('chan') > 0) lines.push('- Lyustry: ' + num('chan') + ' sht');
        if (num('line') > 0) lines.push('- Svetovye linii: ' + num('line') + ' m.p.');
        if (num('curt') > 0) lines.push('- Karniz/nisha: ' + num('curt') + ' m.p.');
        if (num('cor') > 4) lines.push('- Dop. ugly: ' + (num('cor') - 4) + ' sht');
        if (num('pipe') > 0) lines.push('- Obvod trub: ' + num('pipe') + ' sht');
        if (num('tile') > 0) lines.push('- Keramogranit: ' + num('tile') + ' m.p.');
        if (num('ext') > 0) lines.push('- Dop. rashody: ' + num('ext') + ' ' + curr);
        lines.push('ITOGO: ' + document.getElementById('tot').innerText);

        var text = lines.join('\n');
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(function() {
                alert('Смета скопирована!');
            });
        } else {
            prompt('Скопируйте текст сметы вручную (Ctrl+C):', text);
        }
    }

    function clr() {
        var list = ['area', 'perim', 'ins', 'spot', 'chan', 'line', 'curt', 'pipe', 'tile', 'ext'];
        for (var i = 0; i < list.length; i++) {
            document.getElementById(list[i]).value = 0;
        }
        document.getElementById('cor').value = 4;
        calc();
    }
</script>
</body>
</html>
